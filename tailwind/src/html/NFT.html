<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="../output.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body class="min-h-screen bg-[#07172b] flex items-center justify-center p-6">
       <div
        class="w-full max-w-[380px] rounded-[18px] bg-[#102743] p-[26px] shadow-[0_25px_70px_rgba(0,0,0,0.45)]"
    >
        <div
            class="group relative overflow-hidden rounded-[9px] bg-[#07345b]"
        >

            <img
                src="../asset/images/image-equilibrium.jpg"
                alt="Equilibrium NFT artwork"
                class="block aspect-square w-full object-cover transition duration-500 group-hover:scale-105"
            >
            <div
                class="absolute inset-0 flex items-center justify-center bg-cyan-400/20 opacity-0 transition duration-300 group-hover:opacity-100"
            >
                <div class="flex h-12 w-12 items-center justify-center rounded-full bg-cyan-400 text-[#07172b] shadow-lg">
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        class="h-6 w-6"
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke="currentColor"
                        stroke-width="2"
                    >
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
                        />

                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                        />
                    </svg>
                </div>
            </div>

        </div>

        <div class="pt-7">

            <h1 class="text-[23px] font-bold tracking-[-0.4px] text-white">
                Equilibrium #3429
            </h1>
            <p class="mt-4 text-[15px] leading-7 text-[#7891b0]">
                Our Equilibrium collection promotes
                <br>
                balance and calm.
            </p>

            <div class="mt-6 flex items-center justify-between">

                <div class="flex items-center gap-2">

                    <svg
                        width="16"
                        height="22"
                        viewBox="0 0 256 417"
                        xmlns="http://www.w3.org/2000/svg"
                    >
                        <path
                            fill="#21E6E6"
                            d="M127.9 0L126.8 141.4L0 199.1L127.9 273.6L255.8 199.1L129 141.4L127.9 0Z"
                        />

                        <path
                            fill="#17C8D0"
                            d="M127.9 300.3L126.8 416.7L0 237.5L127.9 300.3L255.8 237.5L129 416.7L127.9 300.3Z"
                        />
                    </svg>

                    <span class="text-[14px] font-semibold text-[#27e0df]">
                        0.041 ETH
                    </span>

                </div>

                <div class="flex items-center gap-2 text-[14px] text-[#91a7c2]">

                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        class="h-[17px] w-[17px]"
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke="currentColor"
                        stroke-width="2"
                    >
                        <circle cx="12" cy="12" r="9"/>
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            d="M12 7v5l3 2"
                        />
                    </svg>

                    <span>
                        3 days left
                    </span>

                </div>

            </div>

            <div class="my-6 h-px bg-[#203a58]"></div>

            <div class="flex items-center gap-4">

                <div
                    class="h-10 w-10 overflow-hidden rounded-full border border-[#8192a7] bg-[#263b52]"
                >
                    <img
                        src="../asset/images/image-avatar.png"
                        alt="Creator avatar"
                        class="h-full w-full object-cover"
                    >
                </div>

                <p class="text-[14px] text-[#7891b0]">

                    <span>
                        Creation of
                    </span>

                    <span class="ml-1 font-semibold text-[#b3c3d7]">
                        Jules Wyvern
                    </span>

                </p>

            </div>

        </div>

    </div>
    
</body>
</html>
